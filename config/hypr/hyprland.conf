# ─── Hyprland ── Minimalista Oscuro / Tokyo Night ────────────────────────
# Puerto del setup i3. Wayland-native.

# ─── Monitor ─────────────────────────────────────────────────────────────
# Un solo monitor: resolución y frecuencia preferidas (ver: hyprctl monitors)
monitor = , preferred, auto, 1

# ─── Variables ───────────────────────────────────────────────────────────
$mod      = SUPER
$terminal = ghostty
$launcher = rofi -show drun -show-icons -theme ~/.config/rofi/dark.rasi
$filemgr  = thunar

# ─── Autostart ───────────────────────────────────────────────────────────
# Sin `dex --autostart`: lanzaba de nuevo nm-applet/blueman, picom (es de i3) y JetBrains Toolbox.
# Sin nm-applet/blueman-applet: waybar ya tiene wifi y bluetooth (click -> menú de rofi).
exec-once = xdg-user-dirs-update
exec-once = systemctl --user start hyprpolkitagent
exec-once = dunst
exec-once = hyprpaper
exec-once = hypridle
exec-once = waybar
# Portales para screenshare / file pickers
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# ─── Environment ─────────────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1
# Apps Electron (VS Code, Discord...) nativas en Wayland en vez de XWayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ─── General / Gaps / Border ─────────────────────────────────────────────
general {
    gaps_in = 8
    gaps_out = 2
    border_size = 2
    col.active_border = rgb(7aa2f7)
    col.inactive_border = rgb(222222)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 6
    # Blur apagado: ya no hay ventanas transparentes que lo usen
    blur {
        enabled = false
    }
    # Sombras apagadas: se redibujan en cada frame para cada ventana
    shadow {
        enabled = false
    }
    # Opacas: una ventana inactiva transparente obliga a calcular blur detrás
    active_opacity = 1.0
    inactive_opacity = 1.0
}

# Animaciones cortas y con salida rápida: se sienten instantáneas
animations {
    enabled = true
    bezier = snappy, 0.05, 0.9, 0.1, 1.0
    animation = windows,     1, 2.5, snappy, slide
    animation = windowsOut,  1, 2, snappy, slide
    animation = fade,        1, 2, snappy
    animation = workspaces,  1, 2.5, snappy, slide
    animation = border,      0
}

dwindle {
    preserve_split = true
}

input {
    kb_layout = us
    # Repetición de teclas más rápida (default: 25/s tras 600ms)
    repeat_rate = 50
    repeat_delay = 250
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    # Ventanas que no tienen foco (videos, terminales con logs) a 15 fps
    render_unfocused_fps = 15
    # No vigilar el archivo de config (recargar con $mod+Shift+C)
    disable_autoreload = true
}

cursor {
    # Cursor por hardware: moverlo no obliga a recomponer la pantalla
    no_hardware_cursors = 0
}

render {
    # Pantalla completa (juegos/videos) va directo a la pantalla sin componer
    direct_scanout = 2
    # Mejor scheduling cuando la GPU integrada no llega a 60fps
    new_render_scheduling = true
    # Gestión de color (HDR/wide gamut): innecesaria en un monitor SDR, ahorra shaders
    cm_enabled = false
}

# ─── Keybindings ─────────────────────────────────────────────────────────
# Terminal / launcher / apps
bind = $mod, Return, exec, $terminal
bind = $mod SHIFT, Q, killactive,
bind = $mod, D, exec, $launcher
bind = $mod, N, exec, $filemgr
bind = $mod SHIFT, M, exec, $terminal -e btop
bind = $mod SHIFT, X, exec, hyprlock

# Floating / fullscreen
bind = $mod SHIFT, SPACE, togglefloating,
bind = $mod, F, fullscreen, 0
bind = $mod, P, pseudo,
bind = $mod, V, layoutmsg, togglesplit

# ─── Navigation (j=left k=down l=up ;=right, como i3) ─────────────────────
bind = $mod, J, movefocus, l
bind = $mod, K, movefocus, d
bind = $mod, L, movefocus, u
bind = $mod, semicolon, movefocus, r
bind = $mod, Left,  movefocus, l
bind = $mod, Down,  movefocus, d
bind = $mod, Up,    movefocus, u
bind = $mod, Right, movefocus, r

bind = $mod SHIFT, J, movewindow, l
bind = $mod SHIFT, K, movewindow, d
bind = $mod SHIFT, L, movewindow, u
bind = $mod SHIFT, semicolon, movewindow, r
bind = $mod SHIFT, Left,  movewindow, l
bind = $mod SHIFT, Down,  movewindow, d
bind = $mod SHIFT, Up,    movewindow, u
bind = $mod SHIFT, Right, movewindow, r

# ─── Resize submap ───────────────────────────────────────────────────────
bind = $mod, R, submap, resize
submap = resize
binde = , J, resizeactive, -20 0
binde = , semicolon, resizeactive, 20 0
binde = , K, resizeactive, 0 20
binde = , L, resizeactive, 0 -20
binde = , Left,  resizeactive, -20 0
binde = , Right, resizeactive, 20 0
binde = , Down,  resizeactive, 0 20
binde = , Up,    resizeactive, 0 -20
bind = , Return, submap, reset
bind = , Escape, submap, reset
bind = $mod, R, submap, reset
submap = reset

# ─── Workspaces ──────────────────────────────────────────────────────────
# Switch: $mod+1-0
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Mover ventana: $mod+Shift+1-0
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# ─── Scratchpad (special workspace) ──────────────────────────────────────
bind = $mod, minus, movetoworkspace, special
bind = $mod, plus,  togglespecialworkspace,

# ─── Mouse ───────────────────────────────────────────────────────────────
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ─── Media / brightness / audio (funcionan en Wayland) ───────────────────
bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindl  = , XF86AudioMute,        exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
bindl  = , XF86AudioStop, exec, playerctl stop

# ─── Screenshots (grim + slurp + wl-clipboard) ───────────────────────────
bind = , Print,       exec, grim ~/Pictures/screenshot-$(date +%s).png
bind = $mod, Print,   exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%s).png
bind = SHIFT, Print,  exec, grim -g "$(slurp)" - | wl-copy -t image/png

# ─── Notifications (dunst) ───────────────────────────────────────────────
bind = $mod, BackSpace,       exec, dunstctl close
bind = $mod SHIFT, BackSpace, exec, dunstctl close-all
bind = $mod, grave,           exec, dunstctl history-pop

# ─── System ──────────────────────────────────────────────────────────────
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, E, exit,

# ─── Window rules ────────────────────────────────────────────────────────
# Hyprland 0.55 movió las window rules a Lua (hyprlang ya no las soporta).
# Con esta config hyprlang NO se pueden declarar aquí. Las reglas
# equivalentes están en rules.lua — para activarlas hay que migrar a una
# config Lua (ver README, sección Hyprland). Sin ellas todo funciona, solo
# se pierde el auto-float de pavucontrol/blueman/btop/etc.
