theme = "tokyonight"

[editor]
line-number = "relative"
mouse = true
bufferline = "multiple"
color-modes = true
cursorline = true
cursorcolumn = true
true-color = true
rulers = [80, 120]
idle-timeout = 50
completion-timeout = 50
completion-trigger-len = 1

[editor.gutters]
layout = ["diagnostics", "spacer", "line-numbers", "spacer", "diff"]

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.indent-guides]
render = true

[editor.statusline]
left = ["mode", "spinner", "file-name", "file-modification-indicator", "read-only-indicator"]
center = ["version-control"]
right = ["diagnostics", "selections", "position", "position-percentage", "file-encoding", "file-type"]
separator = "│"

[editor.statusline.mode]
normal = "NORMAL"
insert = "INSERT"
select = "SELECT"

[editor.file-picker]
hidden = false

[editor.inline-diagnostics]
cursor-line = "hint"
other-lines = "error"

[editor.auto-save]
focus-lost = true

[editor.soft-wrap]
enable = true

[keys.normal]
C-g = [":write-all", ":insert-output lazygit >/dev/tty", ":redraw", ":reload-all"]
C-y = [":sh rm -f /tmp/hx-yazi", ":insert-output yazi --chooser-file=/tmp/hx-yazi >/dev/tty", ":open %sh{cat /tmp/hx-yazi}", ":redraw"]

# Imágenes: espacio + i
[keys.normal.space.i]
i = [":write", ":insert-output ~/.config/helix/scripts/hx-img pick '%{buffer_name}' %{language}", ":redraw"]
p = [":write", ":insert-output ~/.config/helix/scripts/hx-img paste '%{buffer_name}' %{language}"]
v = [":write", ":insert-output ~/.config/helix/scripts/hx-img view '%{buffer_name}' %{cursor_line} >/dev/tty", ":redraw"]
o = [":write", ":sh ~/.config/helix/scripts/hx-img open '%{buffer_name}' %{cursor_line}"]
